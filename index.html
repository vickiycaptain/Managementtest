<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Менеджмент: маршрут к тесту</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: бодрый тренер перед тестом, коротко и по делу
   IDEA: схема метро - каждая тема это станция на пути к тесту
   PICTURE: толстая линия маршрута со станциями, которые загораются
   COLOUR and TYPE: белый, линии красная/синяя/жёлтая/зелёная, чёрный; Figtree 800 + Figtree
   LAYOUT: одна колонка под телефон, станция = экран с вкладками */
:root{color-scheme:light dark;--bg:light-dark(#fff,#0e1116);--ink:light-dark(#111,#eef0f3);--mut:light-dark(#5b6270,#9aa3b2);--card:light-dark(#f4f5f7,#181c24);--line:light-dark(#e3e5ea,#2a303b);--ok:#00a05a;--bad:#e6261f;--c:#0a5cff}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 Figtree,system-ui,sans-serif;overflow-x:clip}
main{max-width:760px;margin:0 auto;padding:0 16px 80px}
h1{font-weight:800;font-size:clamp(30px,7vw,46px);line-height:1.05;margin:24px 0 6px;text-wrap:balance}
h2{font-weight:800;font-size:clamp(24px,5vw,32px);line-height:1.1;margin:8px 0 12px;text-wrap:balance}
h3{font-size:19px;margin:22px 0 8px}
button{font:inherit;color:inherit;cursor:pointer;border:0;border-radius:12px;min-height:44px}
button:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.top .sp{flex:1}.xp{font-weight:800;font-size:15px;background:var(--card);padding:8px 12px;border-radius:99px;white-space:nowrap}
.back{background:var(--card);padding:0 14px;font-weight:600}
.sub{color:var(--mut);margin:0 0 18px}
.route{position:relative;margin:18px 0 26px;padding-left:4px}
.route::before{content:"";position:absolute;left:21px;top:22px;bottom:22px;width:10px;border-radius:5px;background:linear-gradient(#e6261f,#0a5cff,#ffb400,#00a05a,#e6261f,#0a5cff)}
.st{position:relative;display:flex;align-items:center;gap:14px;width:100%;background:none;text-align:left;padding:8px 0;min-height:60px}
.dot{flex:none;width:44px;height:44px;border-radius:50%;background:var(--bg);border:6px solid var(--sc);display:grid;place-items:center;font-weight:800;font-size:15px;position:relative;z-index:1}
.st.done .dot{background:var(--sc);color:#fff}
.st b{display:block;font-size:18px;line-height:1.2}.st small{color:var(--mut);font-size:14px}
.big{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.btn{background:var(--c);color:#fff;font-weight:800;padding:12px 18px;font-size:17px}
.btn2{background:var(--card);font-weight:600;padding:12px 18px}
.band{height:12px;border-radius:6px;background:var(--c);margin:14px 0 6px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:6px 0 16px;padding-bottom:2px}
.tabs button{flex:none;background:var(--card);padding:0 14px;font-weight:600;font-size:15px}
.tabs button.on{background:var(--ink);color:var(--bg)}
table{border-collapse:collapse;width:100%;margin:10px 0;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
th{font-weight:800}
.key,.trap{border-radius:14px;padding:12px 16px;margin:14px 0}
.key{background:light-dark(#fff6d6,#2b2510)}.trap{background:light-dark(#ffe9e7,#2e1614)}
.key h4,.trap h4{margin:0 0 4px;font-size:15px}
.key ul,.trap ul{margin:0;padding-left:20px}
ol,ul{padding-left:22px}li{margin:3px 0}
.flash{background:var(--card);border-radius:20px;min-height:220px;display:grid;place-items:center;text-align:center;padding:28px 20px;font-size:21px;font-weight:600;width:100%;border-top:10px solid var(--c)}
.flash.back{font-weight:400;font-size:19px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.row>*{flex:1 1 140px}
.meta{color:var(--mut);font-size:14px;margin:6px 0}
.q{font-size:20px;font-weight:600;margin:6px 0 14px}
.opt{display:block;width:100%;text-align:left;background:var(--card);padding:12px 16px;margin:8px 0;border:2px solid transparent}
.opt.ok{border-color:var(--ok);background:light-dark(#e3f6ec,#11281c)}.opt.no{border-color:var(--bad);background:light-dark(#ffe9e7,#2e1614)}
.ex{border-left:4px solid var(--c);padding:6px 12px;margin:12px 0;color:var(--mut)}
.item{background:var(--card);border-radius:16px;padding:18px;font-size:20px;font-weight:600;text-align:center;margin:10px 0;border-top:8px solid var(--c)}
.bk{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
.bk button{background:var(--c);color:#fff;font-weight:800;padding:8px}
.pool button,.done-list div{display:block;width:100%;text-align:left;background:var(--card);padding:10px 14px;margin:6px 0}
.done-list div{background:light-dark(#e3f6ec,#11281c);border-radius:12px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mt button{background:var(--card);padding:10px;font-size:15px;text-align:left}
.mt button.sel{outline:3px solid var(--c)}.mt button.gone{visibility:hidden}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.flashok{animation:fo .5s}@keyframes fo{50%{transform:scale(1.03)}}
@media(prefers-reduced-motion:reduce){.shake,.flashok{animation:none}}
.res{font-size:clamp(40px,12vw,72px);font-weight:800;line-height:1;margin:10px 0}
.bar{height:10px;background:var(--card);border-radius:5px;overflow:hidden;margin:8px 0 14px}.bar i{display:block;height:100%;background:var(--c)}
.combo{color:var(--ok);font-weight:800}
.lock{opacity:.45}.st:disabled{cursor:not-allowed}
.adm{font-weight:800;font-size:18px;padding:12px 16px;border-radius:14px;background:light-dark(#ffe9e7,#2e1614);color:var(--bad);margin:10px 0}
.adm.yes{background:light-dark(#e3f6ec,#11281c);color:var(--ok)}
.tset{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:14px 0 0;font-weight:600}.tset button{background:var(--card);padding:0 14px;font-weight:600}.tset button.on{background:var(--ink);color:var(--bg)}
.btn:disabled,.btn2:disabled{opacity:.5;cursor:not-allowed}
.tbar{height:6px;background:var(--card);border-radius:3px;overflow:hidden;margin:-6px 0 10px}.tbar i{display:block;height:100%;width:100%;background:var(--ok)}.tbar i.hot{background:var(--bad)}
.rep{color:var(--bad);font-weight:800}
.hint{background:var(--card);border-radius:14px;padding:12px 16px;font-size:15px}
</style></head><body>
<main id="app"></main>

        const x=q.shift();q.splice(Math.min(3,q.length),0,x)}
      save();
      p.querySelector('#after').innerHTML=`<p class="ex"><b>${good?'Верно!':k<0?'Время вышло.':'Не так.'}</b> ${good?'':'Правильно: «'+esc(Q[1])+'». '}${esc(Q[3])}${good?'':' Вопрос скоро вернётся.'}</p><div class="row"><button class="btn" id="nx">Дальше →</button></div>`;
      p.querySelector('#nx').onclick=draw;p.querySelector('#nx').focus();
    };
    p.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>answer(+b.dataset.o));
    TM=setInterval(()=>{const e=(Date.now()-t0)/1000;if(!tb.isConnected)return stopT();tb.style.width=Math.max(0,100-e/lim*100)+'%';tb.classList.toggle('hot',lim-e<5);if(e>=lim)answer(-1)},100);
  };draw();
}
function render(){
  stopT();
  document.documentElement.style.setProperty('--c',view.v=='topic'?T[view.k].c:'#0a5cff');
  if(view.v=='home')home();
  else if(view.v=='topic')topic();
  else if(view.v=='exam'){app.innerHTML=top(true)+`<div class="band"></div><h2>Экзамен по всем темам</h2><div id="pane"></div>`;if(!allMast()){view={v:'home'};return render()}quiz($('#pane'),shuf(allQ().filter(x=>x.t.id!='goal')).slice(0,30),r=>{S.examBest=Math.max(S.examBest||0,r.first);if(r.clean&&S.timer<=20){S.adm=1;save();return 'Чистый экзамен! Допуск к тесту получен. Повтори ещё раз перед тестом.'}save();return 'Для допуска нужен экзамен без единой ошибки на таймере 20 с или меньше. Ещё раз!'},1)}
  else if(view.v=='all'){if(!allMast()){view={v:'home'};return render()}app.innerHTML=top(true)+`<div class="band"></div><h2>Все вопросы подряд</h2><div id="pane"></div>`;quiz($('#pane'),allQ(),null,1)}
  else if(view.v=='mist'){const l=allQ().filter(x=>S.mist.includes(x.id));app.innerHTML=top(true)+`<div class="band" style="background:var(--bad)"></div><h2>Работа над ошибками</h2><div id="pane"></div>`;
    if(!l.length)$('#pane').innerHTML=`<p>Ошибок нет. Вопрос уходит отсюда, когда ответишь на него верно с первой попытки.</p>`;else quiz($('#pane'),l,null,1)}
  else if(view.v=='allcards'){app.innerHTML=top(true)+`<div class="band"></div><h2>Все карточки</h2><div id="pane"></div>`;cards($('#pane'),T.flatMap(t=>t.cards),()=>{view={v:'home'};render()})}
  else if(view.v=='reset'){app.innerHTML=top(true)+`<h2>Сбросить весь прогресс?</h2><div class="row"><button class="btn" id="y" style="background:var(--bad)">Да, сбросить</button><button class="btn2" data-go="home">Нет</button></div>`;$('#y').onclick=()=>{S=S0();save();view={v:'home'};render()}}
  window.scrollTo(0,0);
}
app.addEventListener('click',e=>{
  const tm=e.target.closest('[data-tm]');if(tm){S.timer=+tm.dataset.tm;save();return render()}
  const b=e.target.closest('[data-go],[data-topic],[data-tab]');if(!b||b.disabled)return;
  if(b.dataset.go)view={v:b.dataset.go};
  else if(b.dataset.topic)view={v:'topic',k:+b.dataset.topic,tab:'learn'};
  else if(b.dataset.tab)view.tab=b.dataset.tab;
  render();
});
render();
}
</script></body></html>
